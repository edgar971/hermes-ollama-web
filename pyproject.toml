[project]
name = "hermes-ollama-web"
version = "0.1.0"
description = "Ollama Web Search + Web Fetch backend for Hermes Agent's web_search / web_extract tools"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Edgar Pino" }]
keywords = ["hermes-agent", "hermes-plugin", "ollama", "web-search"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.28.1"]

[project.urls]
Homepage = "https://github.com/edgar971/hermes-ollama-web"
Issues = "https://github.com/edgar971/hermes-ollama-web/issues"

# Pip-install path: Hermes discovers plugins declaring this entry-point group.
# The target module must expose a top-level `register(ctx)`.
[project.entry-points."hermes_agent.plugins"]
web-ollama = "hermes_ollama_web"

[dependency-groups]
dev = [
  "pytest>=9.1.1",
  "respx>=0.23.1",
  "ruff>=0.16.7",
  "ty>=0.0.81",
  # tomllib is stdlib only from 3.11; scripts/check_version_matches_tag.py needs a reader
  # when the resolved interpreter is 3.10.
  "tomli>=2.2.1; python_version < '3.11'",
]

[build-system]
requires = ["hatchling>=1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hermes_ollama_web"]

# plugin.yaml is data Hermes reads at discovery time, not importable code — it must survive
# the wheel build or the pip install loses parity with directory mode.
[tool.hatch.build.targets.wheel.force-include]
"src/hermes_ollama_web/plugin.yaml" = "hermes_ollama_web/plugin.yaml"

[tool.ruff]
line-length = 110
src = ["src", "tests"]
target-version = "py310"

[tool.ruff.lint]
select = [
  "E",    # pycodestyle
  "F",    # pyflakes
  "I",    # isort
  "UP",   # pyupgrade
  "B",    # bugbear
  "BLE",  # blind except
  "SIM",  # simplify
  "C4",   # comprehensions
  "PIE",  # misc lints
  "PT",   # pytest style
  "RET",  # return consistency
  "TID",  # tidy imports
  "PTH",  # prefer pathlib
  "RUF",  # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
# The stub fallback must survive ANY import failure from a partial Hermes checkout.
"tests/conftest.py" = ["BLE001"]

[tool.ty.environment]
# Hermes is the host process, not a pip dependency, so its ABC isn't installable. Point ty at
# the on-disk stub package that mirrors it — the same source the tests fall back to.
extra-paths = ["tests/stubs"]
python-version = "3.10"

[tool.ty.src]
include = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
